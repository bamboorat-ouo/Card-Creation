<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>提示詞</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 50px 20px;
    text-align: center;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: #51445f;
    background: linear-gradient(135deg, #fff8e8, #f1eaff);
}

h1 {
    margin-bottom: 12px;
    color: #7056a8;
    font-size: 36px;
}

h2 {
    color: #8066b0;
}

#聲母 {
    display: inline-block;
    margin: 15px 0;
    padding: 12px 30px;
    border-radius: 16px;
    background: #ffffff;
    color: #7056a8;
    font-size: 28px;
    box-shadow: 0 4px 12px rgba(100, 80, 130, 0.10);
}

.提示詞卡片 {
    max-width: 650px;
    margin: 25px auto;
    padding: 25px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 6px 20px rgba(100, 80, 130, 0.10);
}

#提示詞區 {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 25px;
}

#提示詞區 p {
    min-width: 120px;
    margin: 0;
    padding: 18px 22px;
    border: 2px solid #e5daf8;
    border-radius: 15px;
    background: #ffffff;
    color: #65527e;
    font-size: 24px;
    transition: 0.2s;
}

#提示詞區 p:hover {
    transform: translateY(-4px);
    border-color: #b9a0ed;
    background: #f4edff;
}

.按鈕區 {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
}

button {
    padding: 13px 24px;
    border: none;
    border-radius: 14px;
    background: #9075c9;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    background: #795db5;
}

.返回首頁按鈕 {
    border: 2px solid #d8c9f1;
    background: #ffffff;
    color: #7056a8;
}

.返回首頁按鈕:hover {
    background: #eee6ff;
}

@media (max-width: 600px) {
    body {
        padding: 30px 12px;
    }

    h1 {
        font-size: 29px;
    }

    .提示詞卡片 {
        padding: 20px 12px;
    }

    #提示詞區 p {
        min-width: 100px;
        padding: 14px;
        font-size: 21px;
    }

    button {
        padding: 12px 18px;
    }
}

    </style>
</head>
